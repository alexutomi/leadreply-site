<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | LeadReply</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,#2563eb,#6366f1);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.card{
  background:white;
  border-radius:16px;
  padding:48px 40px;
  width:100%;
  max-width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,0.2);
}
.logo{
  font-size:24px;
  font-weight:700;
  color:#2563eb;
  text-align:center;
  margin-bottom:8px;
}
.tagline{
  text-align:center;
  color:#6b7280;
  font-size:14px;
  margin-bottom:32px;
}
.form-group{margin-bottom:16px;}
.form-group label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:#374151;
  margin-bottom:6px;
}
.form-group input{
  width:100%;
  padding:12px 14px;
  border-radius:8px;
  border:1px solid #d1d5db;
  font-size:15px;
  font-family:inherit;
  transition:border .2s;
}
.form-group input:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,0.1);
}
.btn{
  width:100%;
  padding:14px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  font-family:inherit;
  transition:all .2s;
  margin-top:8px;
}
.btn:hover{background:#1d4ed8;}
.btn:disabled{background:#93c5fd;cursor:not-allowed;}
.error{
  background:#fee2e2;
  color:#dc2626;
  padding:12px 14px;
  border-radius:8px;
  font-size:13px;
  margin-bottom:16px;
  display:none;
}
.footer-link{
  text-align:center;
  margin-top:24px;
  font-size:13px;
  color:#6b7280;
}
.footer-link a{
  color:#2563eb;
  text-decoration:none;
  font-weight:600;
}
</style>
</head>
<body>

<div class="card">
  <div class="logo">LeadReply</div>
  <div class="tagline">Sign in to your account</div>

  <div class="error" id="errorMsg"></div>

  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@example.com">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>

  <button class="btn" id="loginBtn">Sign In</button>

  <div class="footer-link">
    <a href="index.html">← Back to homepage</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  var SUPABASE_URL = 'https://rxnftfnknqhcuvzqmbpu.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4bmZ0Zm5rbnFoY3V2enFtYnB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NTExNzIsImV4cCI6MjA5MTMyNzE3Mn0.D9Gf5Djqu9-dXbY_X-RskjdAIQQuDQ8Za5ynDI8uZGg';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function showError(msg) {
    var el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  async function login() {
    var email    = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var btn      = document.getElementById('loginBtn');

    document.getElementById('errorMsg').style.display = 'none';

    if (!email || !password) {
      showError('Please enter your email and password.');
      return;
    }

    btn.textContent = 'Signing in...';
    btn.disabled = true;

    var result = await sb.auth.signInWithPassword({ email: email, password: password });

    if (result.error) {
      showError('Invalid email or password. Please try again.');
      btn.textContent = 'Sign In';
      btn.disabled = false;
      return;
    }

    var userId = result.data.user.id;

    var roleResult = await sb
      .from('user_roles')
      .select('role')
      .eq('user_id', userId)
      .single();

    var role = roleResult.data ? roleResult.data.role : 'agency';

    if (role === 'admin') {
      window.location.href = 'admin-dashboard.html';
    } else if (role === 'agency') {
      window.location.href = 'agency-dashboard.html';
    } else {
      window.location.href = 'business-dashboard.html';
    }
  }

  // Button click
  document.getElementById('loginBtn').addEventListener('click', login);

  // Enter key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') login();
  });

  // If already logged in redirect immediately
  sb.auth.getSession().then(function(result) {
    if (result.data && result.data.session) {
      sb.from('user_roles')
        .select('role')
        .eq('user_id', result.data.session.user.id)
        .single()
        .then(function(roleResult) {
          var role = roleResult.data ? roleResult.data.role : 'agency';
          if (role === 'admin')       window.location.href = 'admin-dashboard.html';
          else if (role === 'agency') window.location.href = 'agency-dashboard.html';
          else                        window.location.href = 'business-dashboard.html';
        });
    }
  });

})();
</script>
</body>
</html>
